name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Opens a "version packages" PR that accumulates changesets. When that PR
      # is merged, the same step publishes to npm, pushes the git tags, and
      # creates a GitHub Release per published package from its changelog.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 pushes through the GitHub API and reads the token only from this
          # input; the GITHUB_TOKEN environment variable no longer counts.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "version packages"
          pr-title: "version packages"
          create-github-releases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Inlined into the published bundle by tsdown. turbo.json lists it under
          # the build task; without that turbo strips it and the endpoint is empty.
          NEWT_TELEMETRY_URL: ${{ secrets.NEWT_TELEMETRY_URL }}
