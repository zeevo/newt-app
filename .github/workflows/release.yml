name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Opens a "version packages" PR that accumulates changesets. When that PR
      # is merged, the same step publishes to npm and pushes the git tags.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "version packages"
          title: "version packages"
          # Handled by the step below so we get one release per version instead
          # of one per lockstep package.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Single GitHub Release per version, named after the CLI tag, with notes
      # taken from the create-newt-app changelog section that was just written.
      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' \
            | jq -r '.[] | select(.name == "create-newt-app") | .version')
          NOTES=$(awk -v ver="## $VERSION" '
            $0 == ver { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' packages/create-newt-app/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            gh release create "create-newt-app@$VERSION" --title "v$VERSION" --latest --generate-notes
          else
            gh release create "create-newt-app@$VERSION" --title "v$VERSION" --latest --notes "$NOTES"
          fi
