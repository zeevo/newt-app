name: Pull Request

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scaffolder: ${{ steps.filter.outputs.scaffolder }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scaffolder:
              - 'packages/create-newt-app/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pull-request.yml'
              # the scaffold jobs run the scripts/ smoke scripts, so a change to
              # one is only exercised if this filter lets them run
              - 'scripts/**'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  scaffold:
    needs: changes
    if: ${{ needs.changes.outputs.scaffolder == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        flags:
          - "--testing jest"
          - "--include-example"
          - "--shadcn --testing vitest --include-example"
          - "--nest-di-only --testing vitest"
          - "--database postgres --include-example"
          - "--shadcn --linter oxc --include-example"
          - "--shadcn --linter oxc --extras anti-slop --include-example"
          - "--shadcn --nest-di-only --include-example"
          - "--deployment standalone --include-example"
          - "--deployment standalone --linter oxc --include-example"
          - "--deployment standalone --nest-di-only --include-example"
          - "--deployment standalone --nest-di-only --shadcn --testing vitest --database postgres --linter oxc --extras anti-slop"
          - "--deployment spa --include-example"
          - "--deployment spa --shadcn --testing vitest --linter oxc --extras anti-slop"
        # Every entry above scaffolds with --no-install --no-git, so pnpmInstall,
        # pnpmFormat and initGit never run. This include matches an existing
        # combination, so it adds a flag to that job rather than adding a job.
        include:
          - flags: "--include-example"
            cli_tasks: true
    name: scaffold (${{ matrix.flags }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter=create-newt-app

      # initGit commits, and a runner has no git identity of its own.
      - name: Configure git identity
        if: matrix.cli_tasks
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "newt CI"

      - name: Scaffold app
        env:
          CLI_TASKS: ${{ matrix.cli_tasks }}
        run: |
          cd ${{ runner.temp }}
          SKIP_FLAGS="--no-install --no-git"
          if [ "$CLI_TASKS" = "true" ]; then SKIP_FLAGS=""; fi
          node $GITHUB_WORKSPACE/packages/create-newt-app/dist/index.js test-app ${{ matrix.flags }} $SKIP_FLAGS

      # The CLI already installed for the cli_tasks entry. A failed install there
      # aborts the CLI with a non-zero exit, which fails this job at the step above.
      - name: Install scaffolded app
        if: ${{ !matrix.cli_tasks }}
        run: pnpm install
        working-directory: ${{ runner.temp }}/test-app

      - name: Verify the CLI installed, formatted, and committed
        if: matrix.cli_tasks
        working-directory: ${{ runner.temp }}/test-app
        run: |
          test -d node_modules || { echo "::error::no node_modules: pnpm install did not run"; exit 1; }
          test -d apps/web/node_modules || { echo "::error::workspace deps missing under apps/web"; exit 1; }

          commits=$(git rev-list --count HEAD)
          test "$commits" = "1" || { echo "::error::expected exactly 1 commit, got $commits"; exit 1; }

          # Captured once: piping git into an early-exiting reader like grep -q
          # can SIGPIPE git, and pipefail would then turn a real hit into a miss.
          committed=$(git show --name-only --format= HEAD)
          test -n "$committed" || { echo "::error::the initial commit is empty"; exit 1; }
          echo "initial commit: $(git log -1 --format=%s) ($(wc -l <<< "$committed") files)"
          git log --stat -1

          if grep -q '^node_modules/' <<< "$committed"; then
            echo "::error::node_modules was committed"
            exit 1
          fi

          # Formatting already ran, so a second pass has nothing left to change.
          pnpm format
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::pnpm format did not run before the commit"
            git status --porcelain
            exit 1
          fi

      - name: Lint scaffolded app
        run: pnpm lint:check
        working-directory: ${{ runner.temp }}/test-app

      - name: Test scaffolded app
        run: pnpm test
        working-directory: ${{ runner.temp }}/test-app

      - name: Build scaffolded app
        run: pnpm build
        working-directory: ${{ runner.temp }}/test-app

      # An --linter oxc app has a bare oxlint for lint:check, so without this
      # nothing type checks it. Runs after the build because typecheck
      # dependsOn ^build: those upstream builds are cache hits here instead of
      # a second compile.
      - name: Typecheck scaffolded app
        run: pnpm typecheck
        working-directory: ${{ runner.temp }}/test-app

      - name: Smoke test (boot + HTTP probe)
        working-directory: ${{ runner.temp }}/test-app
        run: $GITHUB_WORKSPACE/scripts/smoke.sh "${{ matrix.flags }}"

  # The scaffold matrix boots the standalone build in place on the runner, where
  # workspace packages resolve through the repo's own symlinks, so it only ever
  # *reads* the Dockerfile and never runs it. That is how the one mode which
  # exists to be containerized stayed broken through three separate bugs with CI
  # green. This job builds the images and boots the compose stack for real.
  # Image builds are slow, so it is one representative combination rather than a
  # matrix: postgres, because that is what makes the db and migrate containers
  # do real work.
  scaffold-compose:
    needs: changes
    if: ${{ needs.changes.outputs.scaffolder == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter=create-newt-app

      # Scaffolded with install, unlike the matrix above: the Dockerfile runs
      # `pnpm install --frozen-lockfile`, so the context needs a lockfile.
      - name: Scaffold app
        run: |
          cd ${{ runner.temp }}
          node $GITHUB_WORKSPACE/packages/create-newt-app/dist/index.js test-app \
            --deployment standalone --database postgres --include-example --no-git

      - name: Build images and boot the stack
        working-directory: ${{ runner.temp }}/test-app
        run: |
          docker compose up -d --build || {
            docker compose ps -a
            docker compose logs --tail 200
            exit 1
          }

      - name: Probe the running stack
        working-directory: ${{ runner.temp }}/test-app
        run: $GITHUB_WORKSPACE/scripts/smoke-compose.sh

      - name: Tear down
        if: always()
        working-directory: ${{ runner.temp }}/test-app
        run: docker compose down -v
