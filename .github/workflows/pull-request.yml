name: Pull Request

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.0.0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scaffolder: ${{ steps.filter.outputs.scaffolder }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scaffolder:
              - 'packages/create-newt-app/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pull-request.yml'
              # the scaffold job runs scripts/smoke.sh, so a change to it is
              # only exercised if this filter lets the job run
              - 'scripts/**'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check ui drift against templates
        run: pnpm check-ui-drift

  scaffold:
    needs: changes
    if: ${{ needs.changes.outputs.scaffolder == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        flags:
          - "--testing jest"
          - "--include-example"
          - "--shadcn --testing vitest --include-example"
          - "--nest-di-only"
          - "--database postgres --include-example"
          - "--shadcn --linter oxc --include-example"
          - "--shadcn --nest-di-only --include-example"
          - "--deployment standalone --include-example"
          - "--deployment standalone --nest-di-only --include-example"
          - "--deployment spa --include-example"
          - "--deployment custom-server --include-example"
        # Every entry above scaffolds with --no-install --no-git, so pnpmInstall,
        # pnpmFormat and initGit never run. This include matches an existing
        # combination, so it adds a flag to that job rather than adding a job.
        include:
          - flags: "--include-example"
            cli_tasks: true
    name: scaffold (${{ matrix.flags }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter=create-newt-app

      # initGit commits, and a runner has no git identity of its own.
      - name: Configure git identity
        if: matrix.cli_tasks
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "newt CI"

      - name: Scaffold app
        env:
          CLI_TASKS: ${{ matrix.cli_tasks }}
        run: |
          cd ${{ runner.temp }}
          SKIP_FLAGS="--no-install --no-git"
          if [ "$CLI_TASKS" = "true" ]; then SKIP_FLAGS=""; fi
          node $GITHUB_WORKSPACE/packages/create-newt-app/dist/index.js test-app ${{ matrix.flags }} $SKIP_FLAGS

      # The CLI already installed for the cli_tasks entry. A failed install there
      # aborts the CLI with a non-zero exit, which fails this job at the step above.
      - name: Install scaffolded app
        if: ${{ !matrix.cli_tasks }}
        run: pnpm install
        working-directory: ${{ runner.temp }}/test-app

      - name: Verify the CLI installed, formatted, and committed
        if: matrix.cli_tasks
        working-directory: ${{ runner.temp }}/test-app
        run: |
          test -d node_modules || { echo "::error::no node_modules: pnpm install did not run"; exit 1; }
          test -d apps/web/node_modules || { echo "::error::workspace deps missing under apps/web"; exit 1; }

          commits=$(git rev-list --count HEAD)
          test "$commits" = "1" || { echo "::error::expected exactly 1 commit, got $commits"; exit 1; }

          # Captured once: piping git into an early-exiting reader like grep -q
          # can SIGPIPE git, and pipefail would then turn a real hit into a miss.
          committed=$(git show --name-only --format= HEAD)
          test -n "$committed" || { echo "::error::the initial commit is empty"; exit 1; }
          echo "initial commit: $(git log -1 --format=%s) ($(wc -l <<< "$committed") files)"
          git log --stat -1

          if grep -q '^node_modules/' <<< "$committed"; then
            echo "::error::node_modules was committed"
            exit 1
          fi

          # Formatting already ran, so a second pass has nothing left to change.
          pnpm format
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::pnpm format did not run before the commit"
            git status --porcelain
            exit 1
          fi

      - name: Lint scaffolded app
        run: pnpm lint
        working-directory: ${{ runner.temp }}/test-app

      - name: Test scaffolded app
        run: pnpm test
        working-directory: ${{ runner.temp }}/test-app

      - name: Build scaffolded app
        run: pnpm build
        working-directory: ${{ runner.temp }}/test-app

      - name: Smoke test (boot + HTTP probe)
        working-directory: ${{ runner.temp }}/test-app
        run: $GITHUB_WORKSPACE/scripts/smoke.sh "${{ matrix.flags }}"
