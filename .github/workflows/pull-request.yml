name: Pull Request

on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--ci"
          - "--ci --bare"
          - "--ci --shadcn --testing vitest"
          - "--ci --bare --nest-di-only"
          - "--ci --database postgres"
          - "--ci --shadcn --linter oxc"
    name: scaffold (${{ matrix.flags }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter=create-newt-app

      - name: Scaffold app
        run: |
          cd ${{ runner.temp }}
          node $GITHUB_WORKSPACE/packages/create-newt-app/dist/index.js test-app ${{ matrix.flags }} --no-install --no-git

      - name: Install scaffolded app
        run: pnpm install
        working-directory: ${{ runner.temp }}/test-app

      - name: Lint scaffolded app
        run: pnpm lint
        working-directory: ${{ runner.temp }}/test-app

      - name: Test scaffolded app
        run: pnpm test
        working-directory: ${{ runner.temp }}/test-app

      - name: Build scaffolded app
        run: pnpm build
        working-directory: ${{ runner.temp }}/test-app

      # Boot the built app and prove it actually serves. Only on the default
      # combo: the API's /api/hello is @AllowAnonymous, so no database needed
      # (default is SQLite). Web homepage doesn't server-fetch the API.
      - name: Smoke test (boot + HTTP probe)
        if: matrix.flags == '--ci'
        working-directory: ${{ runner.temp }}/test-app
        run: |
          set -euo pipefail

          pnpm --filter api start:prod > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          pnpm --filter web start > "$RUNNER_TEMP/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT

          wait_for() {
            local url=$1 name=$2 log=$3
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$url"; then
                echo "$name is serving $url"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name did not serve $url within 60s"
            cat "$log"
            return 1
          }

          wait_for http://localhost:3001/api/hello api "$RUNNER_TEMP/api.log"
          wait_for http://localhost:3000 web "$RUNNER_TEMP/web.log"

          body=$(curl -sf http://localhost:3001/api/hello)
          echo "api response: $body"
          echo "$body" | grep -q "Hello from Nest" || {
            echo "::error::unexpected /api/hello body: $body"
            exit 1
          }
