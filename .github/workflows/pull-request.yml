name: Pull Request

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.0.0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scaffolder: ${{ steps.filter.outputs.scaffolder }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scaffolder:
              - 'packages/create-newt-app/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pull-request.yml'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  scaffold:
    needs: changes
    if: ${{ needs.changes.outputs.scaffolder == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        flags:
          - "--testing jest"
          - "--bare"
          - "--shadcn --testing vitest"
          - "--bare --nest-di-only"
          - "--database postgres"
          - "--shadcn --linter oxc"
          - "--shadcn --nest-di-only"
          - "--deployment standalone"
          - "--deployment standalone --nest-di-only"
          - "--deployment spa"
          - "--deployment custom-server"
    name: scaffold (${{ matrix.flags }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter=create-newt-app

      - name: Scaffold app
        run: |
          cd ${{ runner.temp }}
          node $GITHUB_WORKSPACE/packages/create-newt-app/dist/index.js test-app ${{ matrix.flags }} --no-install --no-git

      - name: Install scaffolded app
        run: pnpm install
        working-directory: ${{ runner.temp }}/test-app

      - name: Lint scaffolded app
        run: pnpm lint
        working-directory: ${{ runner.temp }}/test-app

      - name: Test scaffolded app
        run: pnpm test
        working-directory: ${{ runner.temp }}/test-app

      - name: Build scaffolded app
        run: pnpm build
        working-directory: ${{ runner.temp }}/test-app

      - name: Smoke test (boot + HTTP probe)
        working-directory: ${{ runner.temp }}/test-app
        run: $GITHUB_WORKSPACE/scripts/smoke.sh "${{ matrix.flags }}"
